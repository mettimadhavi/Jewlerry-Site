<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   .card{
        width: 300px;
        height: 400px;
        background-color: yellow;
        }
         .card:hover{
        width: 300px;
        height: 400px;
        cursor:pointer;
        background-color: green;
        }
        img:hover{
            width: 400px;
            height: 500px;
            cursor:pointer;
            transition: transform 5s ease  ;
        }
         /* img{
            width: 400px;
            height: 500px;
            cursor:pointer;
        } */

    </style>
</head>
<body>
    <div class="card">
      <img src="./image.png" alt="Image" width="300px" height="200px" style="transition: transform 5s ease;" onmouseover="setTimeout(( ) => { document.querySelector('img').style.transform = 'translateX(-100px)'; }, 5000);"/>
      <h1> Add to cart</h1>
    </div>
</body>
</html>
